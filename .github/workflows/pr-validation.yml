name: PR Validation

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - name: Run HTMLHint
        run: npx htmlhint src/**/*.html
      - name: Run Stylelint
        run: npx stylelint "**/*.css"

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - run: npm install
      - name: Build with Parcel
        run: npx parcel build src/*.html --dist-dir build
